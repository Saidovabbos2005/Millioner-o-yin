<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kim millioner bo'lmoqchi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e2a;
    --bg-deep: #050815;
    --panel: #131a45;
    --panel-2: #1b2456;
    --line: #2c3670;
    --gold: #e8b830;
    --gold-bright: #f6d367;
    --violet: #6d5bd0;
    --text: #f2efe4;
    --text-dim: #a9aed6;
    --correct: #3fa35a;
    --wrong: #c1443b;
    --shadow: rgba(0,0,0,0.45);
    color-scheme: dark;
  }
  :root:not([data-theme="light"]) {
    --bg: #0a0e2a;
    --panel: #131a45;
    --text: #f2efe4;
  }
  :root[data-theme="light"] {
    --bg: #eceafc;
    --bg-deep: #dcd9f7;
    --panel: #ffffff;
    --panel-2: #f3f1ff;
    --line: #cfc9f0;
    --gold: #b8860f;
    --gold-bright: #c99a1f;
    --violet: #5a49b8;
    --text: #191637;
    --text-dim: #524d7a;
    --correct: #2f8a48;
    --wrong: #a83730;
    --shadow: rgba(90,73,184,0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a0e2a;
      --panel: #131a45;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: radial-gradient(ellipse at 50% -10%, var(--panel-2) 0%, var(--bg) 55%, var(--bg-deep) 100%);
    color: var(--text);
    font-family: "Manrope", -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    padding: 20px 14px 40px;
    display: flex;
    justify-content: center;
  }
  .stage {
    width: 100%;
    max-width: 760px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  header.topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: clamp(22px, 5vw, 30px);
    letter-spacing: 0.2px;
    margin: 0;
    color: var(--gold-bright);
  }
  .theme-toggle {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-dim);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12px;
    font-family: "Manrope", sans-serif;
    cursor: pointer;
  }

  .prize-strip {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 4px 2px 10px;
    scrollbar-width: thin;
  }
  .prize-pill {
    flex: 0 0 auto;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-dim);
    background: var(--panel);
    border: 1px solid var(--line);
    white-space: nowrap;
  }
  .prize-pill.checkpoint { border-color: var(--gold); color: var(--gold-bright); }
  .prize-pill.current { background: var(--gold); color: #201703; border-color: var(--gold); transform: scale(1.06); }
  .prize-pill.done { color: var(--correct); }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 20px 50px var(--shadow);
    padding: 22px;
  }

  .qmeta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 10px;
    font-weight: 600;
  }
  .qmeta .amount { color: var(--gold-bright); font-size: 15px; }

  #question-text {
    font-family: "Fraunces", Georgia, serif;
    font-size: clamp(18px, 4.4vw, 23px);
    line-height: 1.4;
    margin: 6px 0 20px;
  }

  .options {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }
  @media (min-width: 520px) {
    .options { grid-template-columns: 1fr 1fr; }
  }
  .opt {
    text-align: left;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 13px 14px;
    border-radius: 10px;
    font-family: "Manrope", sans-serif;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    gap: 10px;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .opt .tag {
    color: var(--gold-bright);
    font-family: "Fraunces", serif;
    font-weight: 600;
  }
  .opt:hover:not(:disabled) { border-color: var(--gold); transform: translateY(-1px); }
  .opt:disabled { cursor: default; }
  .opt.removed { opacity: 0.18; pointer-events: none; }
  .opt.locked-in { border-color: var(--violet); background: color-mix(in srgb, var(--violet) 30%, var(--panel-2)); animation: pulse 0.9s infinite; }
  .opt.correct { border-color: var(--correct); background: color-mix(in srgb, var(--correct) 35%, var(--panel-2)); }
  .opt.wrong { border-color: var(--wrong); background: color-mix(in srgb, var(--wrong) 35%, var(--panel-2)); }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--violet) 55%, transparent); }
    50% { box-shadow: 0 0 0 8px transparent; }
  }

  .lifelines {
    display: flex;
    gap: 10px;
    margin: 16px 0 4px;
  }
  .life-btn {
    flex: 1;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px 6px;
    border-radius: 10px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: "Manrope", sans-serif;
  }
  .life-btn:disabled { opacity: 0.28; cursor: default; }

  .helper-box {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 10px;
    background: var(--panel-2);
    border: 1px dashed var(--line);
    font-size: 13.5px;
    color: var(--text-dim);
    display: none;
  }
  .helper-box.show { display: block; }
  .audience-bar-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .audience-label { width: 22px; font-weight: 700; color: var(--gold-bright); }
  .audience-track { flex: 1; background: var(--bg-deep); border-radius: 6px; height: 14px; overflow: hidden; }
  .audience-fill { height: 100%; background: var(--gold); border-radius: 6px 0 0 6px; }
  .audience-pct { width: 34px; text-align: right; font-size: 12px; }

  .actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    gap: 10px;
  }
  .quit-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-dim);
    padding: 9px 14px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .next-btn {
    background: var(--gold);
    border: none;
    color: #201703;
    padding: 9px 18px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 800;
    cursor: pointer;
    display: none;
  }

  .end-screen { text-align: center; padding: 30px 16px; }
  .end-screen .icon { font-size: 42px; }
  .end-screen h2 {
    font-family: "Fraunces", serif;
    font-size: 24px;
    margin: 10px 0 4px;
    color: var(--gold-bright);
  }
  .end-screen .amount-final {
    font-size: 30px;
    font-weight: 800;
    margin: 12px 0 18px;
    font-family: "Fraunces", serif;
  }
  .restart-btn {
    background: var(--violet);
    border: none;
    color: #fff;
    padding: 12px 24px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
  }

  footer.note {
    text-align: center;
    font-size: 11.5px;
    color: var(--text-dim);
    opacity: 0.7;
  }
</style>
</head>
<body>
<div class="stage">

  <header class="topbar">
    <h1>Kim millioner bo'lmoqchi</h1>
    <button class="theme-toggle" id="themeToggle" type="button">Yorug' rejim</button>
  </header>

  <div class="prize-strip" id="prizeStrip"></div>

  <div class="card" id="gameCard">
    <div class="qmeta">
      <span id="qNumberLabel">1-savol / 15</span>
      <span class="amount" id="qAmountLabel">250 000 so'm</span>
    </div>
    <div id="question-text"></div>
    <div class="options" id="optionsWrap"></div>

    <div class="lifelines">
      <button class="life-btn" id="lifeline5050" type="button">50/50</button>
      <button class="life-btn" id="lifelineFriend" type="button">📞 Do'stga qo'ng'iroq</button>
      <button class="life-btn" id="lifelineAudience" type="button">👥 Tomoshabinlar</button>
    </div>

    <div class="helper-box" id="helperBox"></div>

    <div class="actions">
      <button class="quit-btn" id="quitBtn" type="button">Pulni olib to'xtatish</button>
      <button class="next-btn" id="nextBtn" type="button">Keyingi savol →</button>
    </div>
  </div>

  <div class="card end-screen" id="endScreen" style="display:none;">
    <div class="icon" id="endIcon">🏆</div>
    <h2 id="endTitle">O'yin tugadi</h2>
    <div class="amount-final" id="endAmount">0 so'm</div>
    <div id="endMessage" style="color:var(--text-dim); font-size:14px; margin-bottom:6px;"></div>
    <button class="restart-btn" id="restartBtn" type="button">Yana o'ynash</button>
  </div>

  <footer class="note">Jamol, Komol va Latika ruhida tayyorlangan bilim o'yini — 250 000 so'mdan 50 000 000 so'mgacha.</footer>
</div>

<script>
(function(){
  const questions = [
    { amount: 250000, q: "Tiniq kunda osmon qanday rangda ko'rinadi?", opts: ["Ko'k", "Qizil", "Sariq", "Yashil"], correct: 0 },
    { amount: 500000, q: "Bir haftada nechta kun bor?", opts: ["5", "6", "7", "8"], correct: 2 },
    { amount: 1000000, q: "O'zbekiston Respublikasining poytaxti qaysi shahar?", opts: ["Buxoro", "Samarqand", "Toshkent", "Xiva"], correct: 2 },
    { amount: 2000000, q: "Suvning kimyoviy formulasi qanday yoziladi?", opts: ["CO2", "H2O", "O2", "NaCl"], correct: 1 },
    { amount: 3000000, q: "Dunyodagi eng baland tog' cho'qqisi qaysi?", opts: ["Elbrus", "Kilimanjaro", "Mont Blan", "Everest"], correct: 3 },
    { amount: 5000000, q: "\"Mona Liza\" asarini kim chizgan?", opts: ["Pablo Picasso", "Leonardo da Vinci", "Vincent van Gogh", "Michelangelo"], correct: 1 },
    { amount: 7000000, q: "Quyosh tizimida nechta sayyora bor?", opts: ["7", "8", "9", "10"], correct: 1 },
    { amount: 10000000, q: "Ko'pgina dasturlash tillarida (masalan, Python) ro'yxat qaysi indeksdan boshlanadi?", opts: ["1", "0", "-1", "10"], correct: 1 },
    { amount: 15000000, q: "Yer sayyorasidagi eng katta okean qaysi?", opts: ["Hind okeani", "Atlantika okeani", "Tinch okean", "Shimoliy Muz okeani"], correct: 2 },
    { amount: 20000000, q: "HTML tilida eng katta (birinchi darajali) sarlavha tegi qaysi?", opts: ["h6", "head", "h1", "H"], correct: 2 },
    { amount: 25000000, q: "Hozirda Nobel mukofoti nechta yo'nalish bo'yicha topshiriladi?", opts: ["5", "6", "7", "4"], correct: 1 },
    { amount: 30000000, q: "Telegram botlar odatda qaysi interfeys orqali boshqariladi?", opts: ["Bot API", "SOAP API", "FTP", "USB API"], correct: 0 },
    { amount: 35000000, q: "Sun'iy intellekt va ma'lumotlar tahlili sohasida eng ko'p ishlatiladigan dasturlash tili qaysi?", opts: ["Pascal", "Fortran", "Python", "PHP"], correct: 2 },
    { amount: 40000000, q: "Oyga birinchi bo'lib qadam bosgan inson kim bo'lgan?", opts: ["Yuriy Gagarin", "Buzz Aldrin", "Neil Armstrong", "Valentina Tereshkova"], correct: 2 },
    { amount: 50000000, q: "Internetdagi ma'lumot uzatishning asosiy protokoli qanday nomlanadi?", opts: ["FTP", "SMTP", "HTTP", "TCP/IP"], correct: 3 }
  ];
  const checkpoints = [4, 9]; // zero-indexed question numbers that lock in that prize (question 5 -> 3,000,000 ; question 10 -> 20,000,000)

  let current = 0;
  let usedFifty = false, usedFriend = false, usedAudience = false;
  let removedOpts = [];
  let locked = false;

  const prizeStrip = document.getElementById('prizeStrip');
  const optionsWrap = document.getElementById('optionsWrap');
  const questionText = document.getElementById('question-text');
  const qNumberLabel = document.getElementById('qNumberLabel');
  const qAmountLabel = document.getElementById('qAmountLabel');
  const nextBtn = document.getElementById('nextBtn');
  const quitBtn = document.getElementById('quitBtn');
  const helperBox = document.getElementById('helperBox');
  const gameCard = document.getElementById('gameCard');
  const endScreen = document.getElementById('endScreen');
  const endIcon = document.getElementById('endIcon');
  const endTitle = document.getElementById('endTitle');
  const endAmount = document.getElementById('endAmount');
  const endMessage = document.getElementById('endMessage');

  function fmt(n){ return n.toLocaleString('ru-RU').replace(/,/g, ' ') + " so'm"; }

  function safeAmount(idx){
    // amount guaranteed if you fail on question idx (0-based) — last passed checkpoint
    let guaranteed = 0;
    for(const c of checkpoints){
      if(idx > c) guaranteed = questions[c].amount;
    }
    return guaranteed;
  }

  function renderPrizeStrip(){
    prizeStrip.innerHTML = '';
    for(let i = questions.length - 1; i >= 0; i--){
      const pill = document.createElement('div');
      pill.className = 'prize-pill';
      if(checkpoints.includes(i)) pill.classList.add('checkpoint');
      if(i < current) pill.classList.add('done');
      if(i === current) pill.classList.add('current');
      pill.textContent = (i+1) + '. ' + fmt(questions[i].amount);
      prizeStrip.appendChild(pill);
    }
  }

  function renderQuestion(){
    locked = false;
    removedOpts = [];
    helperBox.className = 'helper-box';
    helperBox.innerHTML = '';
    nextBtn.style.display = 'none';
    const q = questions[current];
    qNumberLabel.textContent = (current+1) + '-savol / ' + questions.length;
    qAmountLabel.textContent = fmt(q.amount);
    questionText.textContent = q.q;
    optionsWrap.innerHTML = '';
    const tags = ['A','B','C','D'];
    q.opts.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.innerHTML = '<span class="tag">' + tags[i] + '.</span><span>' + opt + '</span>';
      btn.addEventListener('click', () => selectOption(i));
      optionsWrap.appendChild(btn);
    });
    quitBtn.style.display = current === 0 ? 'none' : 'inline-block';
    quitBtn.disabled = false;
    document.getElementById('lifeline5050').disabled = usedFifty;
    document.getElementById('lifelineFriend').disabled = usedFriend;
    document.getElementById('lifelineAudience').disabled = usedAudience;
    renderPrizeStrip();
  }

  function selectOption(i){
    if(locked) return;
    if(removedOpts.includes(i)) return;
    locked = true;
    const q = questions[current];
    const btns = optionsWrap.querySelectorAll('.opt');
    btns[i].classList.add('locked-in');
    btns.forEach(b => b.disabled = true);
    document.getElementById('lifeline5050').disabled = true;
    document.getElementById('lifelineFriend').disabled = true;
    document.getElementById('lifelineAudience').disabled = true;
    quitBtn.disabled = true;

    setTimeout(() => {
      btns[i].classList.remove('locked-in');
      if(i === q.correct){
        btns[i].classList.add('correct');
        if(current === questions.length - 1){
          setTimeout(() => showEnd(true, q.amount), 900);
        } else {
          nextBtn.style.display = 'inline-block';
        }
      } else {
        btns[i].classList.add('wrong');
        btns[q.correct].classList.add('correct');
        setTimeout(() => showEnd(false, safeAmount(current)), 1400);
      }
    }, 1300);
  }

  nextBtn.addEventListener('click', () => {
    current++;
    renderQuestion();
  });

  quitBtn.addEventListener('click', () => {
    const wonAmount = current === 0 ? 0 : questions[current - 1].amount;
    showEnd(true, wonAmount, true);
  });

  function showEnd(won, amount, quit){
    gameCard.style.display = 'none';
    endScreen.style.display = 'block';
    if(quit){
      endIcon.textContent = '🚪';
      endTitle.textContent = "O'yindan chiqdingiz";
      endMessage.textContent = "Yutuqni saqlab qoldingiz.";
    } else if(won){
      endIcon.textContent = '🏆';
      endTitle.textContent = "Tabriklaymiz!";
      endMessage.textContent = "Barcha savollarga to'g'ri javob berdingiz — Jamol va Komolga o'xshab g'olib chiqdingiz!";
    } else {
      endIcon.textContent = '😔';
      endTitle.textContent = "Noto'g'ri javob";
      endMessage.textContent = amount > 0 ? "Kafolatlangan summa saqlanib qoldi." : "Keyingi safar omad tilaymiz.";
    }
    endAmount.textContent = fmt(amount);
  }

  document.getElementById('restartBtn').addEventListener('click', () => {
    current = 0;
    usedFifty = usedFriend = usedAudience = false;
    endScreen.style.display = 'none';
    gameCard.style.display = 'block';
    renderQuestion();
  });

  // Lifelines
  document.getElementById('lifeline5050').addEventListener('click', () => {
    if(usedFifty || locked) return;
    usedFifty = true;
    const q = questions[current];
    const wrongIdxs = [0,1,2,3].filter(i => i !== q.correct);
    wrongIdxs.sort(() => Math.random() - 0.5);
    const toRemove = wrongIdxs.slice(0, 2);
    removedOpts = toRemove;
    const btns = optionsWrap.querySelectorAll('.opt');
    toRemove.forEach(i => btns[i].classList.add('removed'));
    document.getElementById('lifeline5050').disabled = true;
  });

  document.getElementById('lifelineFriend').addEventListener('click', () => {
    if(usedFriend || locked) return;
    usedFriend = true;
    const q = questions[current];
    const tags = ['A','B','C','D'];
    const confident = Math.random() < 0.78;
    const guess = confident ? q.correct : [0,1,2,3].filter(i => i !== q.correct && !removedOpts.includes(i))[0];
    const confidence = confident ? (65 + Math.floor(Math.random()*25)) : (40 + Math.floor(Math.random()*20));
    helperBox.className = 'helper-box show';
    helperBox.innerHTML = "📞 Do'stingiz: \"Ishonchim komil emas, lekin menimcha javob <strong>" + tags[guess] + "</strong> bo'lishi kerak, taxminan " + confidence + "% ishonchim bor.\"";
    document.getElementById('lifelineFriend').disabled = true;
  });

  document.getElementById('lifelineAudience').addEventListener('click', () => {
    if(usedAudience || locked) return;
    usedAudience = true;
    const q = questions[current];
    const active = [0,1,2,3].filter(i => !removedOpts.includes(i));
    let base = active.map(i => i === q.correct ? (45 + Math.random()*35) : Math.random()*30);
    const sum = base.reduce((a,b) => a+b, 0);
    let pcts = base.map(v => Math.round((v/sum)*100));
    let diff = 100 - pcts.reduce((a,b)=>a+b,0);
    pcts[0] += diff;
    const tags = ['A','B','C','D'];
    let html = "👥 Tomoshabinlar ovozi:";
    active.forEach((idx, k) => {
      html += '<div class="audience-bar-row"><div class="audience-label">' + tags[idx] + '</div><div class="audience-track"><div class="audience-fill" style="width:' + pcts[k] + '%"></div></div><div class="audience-pct">' + pcts[k] + '%</div></div>';
    });
    helperBox.className = 'helper-box show';
    helperBox.innerHTML = html;
    document.getElementById('lifelineAudience').disabled = true;
  });

  document.getElementById('themeToggle').addEventListener('click', () => {
    const root = document.documentElement;
    const isLight = root.getAttribute('data-theme') === 'light';
    if(isLight){
      root.removeAttribute('data-theme');
      document.getElementById('themeToggle').textContent = "Yorug' rejim";
    } else {
      root.setAttribute('data-theme', 'light');
      document.getElementById('themeToggle').textContent = "Qorong'u rejim";
    }
  });

  renderQuestion();
})();
</script>
</body>
</html>
